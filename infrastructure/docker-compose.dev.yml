# ─────────────────────────────────────────────────────────────
# New Blossom — Docker Compose Dev Override
#
# Used automatically by docker compose when both
# docker-compose.yml and docker-compose.dev.yml are specified.
# Mounts source code as volumes for hot reload in development.
# ─────────────────────────────────────────────────────────────

services:
  web:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../web/src:/app/src
      - ../web/public:/app/public
      - ../web/next.config.ts:/app/next.config.ts
      - ../web/tsconfig.json:/app/tsconfig.json
      - ../web/package.json:/app/package.json
      - ../web/package-lock.json:/app/package-lock.json
      # Don't mount node_modules from host — use container's
      - nb-web-node-modules:/app/node_modules
      - nb-web-next:/app/.next
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
      - WATCHPACK_POLLING=true
    command: npm run dev

  api:
    build:
      dockerfile: Dockerfile.dev
    volumes:
      - ../api:/app
      - nb-api-go-mod:/app/go
    environment:
      - APP_ENV=development
    command: go run ./cmd/api

volumes:
  nb-web-node-modules:
    driver: local
  nb-web-next:
    driver: local
  nb-api-go-mod:
    driver: local
